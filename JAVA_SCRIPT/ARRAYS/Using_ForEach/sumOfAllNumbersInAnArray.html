<!-- 2)sum all numbers in an array 
Input: [1, 2, 3, 4]
Output: 10
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.Sum Of All Numbers In An Array</title>
</head>
<body>
    <h1>2.Sum Of All Numbers In An Array</h1>
    <script>
        function sum(){
            let numbers = [1,2,3,4,5];
            let sum = 0;
            numbers.forEach(function(number){
               sum += number; 
            });
            console.log(sum);
        }
        sum();
    </script>
</body>
</html>
