<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.Binary Strings</title>
</head>
<body>
    <h1>8.Binary Strings</h1>
    <script>
        let numbers = [2,3,5];
        let  result = numbers.map(function(num){
            return num.toString(2);
        });
        console.log(result);
    </script>
</body>
