<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7.length Of Words</title>
</head>
<body>
    <h1>7.length Of Words</h1>
    <script>
        let words = ["The","quick","brown","fox"];
        let result = words.map(function(word){
            return word.length;
        });
        console.log(result);
    </script>
</body>
