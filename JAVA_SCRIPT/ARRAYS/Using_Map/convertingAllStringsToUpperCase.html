<!-- 2)Given an array of strings, convert all strings to uppercase
Input: ["hello", "world"]
Output: ["HELLO", "WORLD"] -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.ConvertingString to UpperCase</title>
</head>
<body>
    <h1>2.Converting String to UpperCase</h1>
    <script>
        let words = ["hello", "world"];
        let result = words.map(function(word){
            return word.toUpperCase();
        });
        console.log(result);
    </script>
</body>
</html>
