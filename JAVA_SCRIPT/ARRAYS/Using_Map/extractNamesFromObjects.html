<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.Exact Names From Objects</title>
</head>
<body>
    <h1>5.Exact Names From Objects</h1>
    <script>
        let users = [{name: "Alice"}, {name: "Bob"}];
        let result = users.map(function(user){
            return user.name;
        });
        console.log(result);
    </script>
</body>
</html>
