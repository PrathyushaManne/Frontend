 Input: [1, 2, 3, 4]
 Output: [2, 3, 4]  -->

<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.Exclude First Element</title>
</head>
<body>
    <h1>3.Exclude First Element</h1>
    <script>
        function excludeFirst(){
        let numbers = [1,2,3,4];

        console.log(result);
        }
        excludeFirst(); 
    </script>
