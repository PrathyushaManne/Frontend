<!-- Using slice 
1)create a subarray that contains the first three elements of an array 
Input: [1, 2, 3, 4, 5] 
Output: [1, 2, 3]-->
<!-- slice() => Copy a portion of an array
and return a new array.

we can =>
1. Get first few elements
2. Get last few elements
3. Create a shallow copy of an array
4. Extract a range of elements
5. Preserve the original array

we can't =>
1. Add elements
2. Remove elements
3. Replace elements
4. Modify the original array

Reason:
slice() only copies data, it does not modify data. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.First Three Elements</title>
</head>
<body>
    <h1>1.First Three Elements</h1>
    <script>
        function firstThree(){
        let numbers = [1,2,3,4,5];
        let result = numbers.slice(0,3);
        console.log(result);
        }
        firstThree();
    </script>
</body>
</html>
