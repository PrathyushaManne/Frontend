<!-- 5)extract a portion of an array from index 2 to index 5 
 Input: [1, 2, 3, 4, 5, 6]
 Output: [3, 4, 5] -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.Extract Portion</title>
</head>
<body>
    <h1>5.Extract Portion</h1>
    <script>
        function extractPortion(){
        let numbers = [1,2,3,4,5,6];
        let result = numbers.slice(2,5);
        console.log(result);
        }
        extractPortion();
    </script>
</body>
</html>
