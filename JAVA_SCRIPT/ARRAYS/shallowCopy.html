<!-- 4)create a shallow copy of an array
  Input: [1, 2, 3]
 Output: [1, 2, 3] 
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.Shallow Copy</title>
</head>
<body>
    <h1>4.Shallow Copy</h1>
    <script>
        function copyArray(){
        let numbers = [1,2,3];
        let result = numbers.slice();
        console.log(result);
        }
        copyArray();
    </script>
</body>
</html>
