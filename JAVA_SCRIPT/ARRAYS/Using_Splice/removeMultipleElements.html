<!-- 4)remove multiple elements from an array starting at a specific index 
Input: [1, 2, 3, 4, 5], Start: 1, Delete Count: 2
Output: [1, 4, 5]-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.Remove Multiple Elements</title>
</head>
<body>
    <h1>4.Remove Multiple Elements</h1>
    <script>
        function removeMultiple(){
        let numbers = [1,2,3,4,5];
        numbers.splice(1,2);
        console.log(numbers);
        }
        removeMultiple();
    </script>
</body>
</html>
