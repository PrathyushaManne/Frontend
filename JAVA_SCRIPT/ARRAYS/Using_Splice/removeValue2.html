<!-- 5) create a copy of an array without certain elements
Input: [1, 2, 3, 4], Remove: 2
Output: [1, 3, 4] -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.Remove Value 2</title>
</head>
<body>
    <h1>5.Remove Value 2</h1>
    <script>
        function removeValue(){
        let numbers = [1,2,3,4];
        let index = numbers.indexOf(2);
        numbers.splice(index,1);
        console.log(numbers);
        }
        removeValue();
    </script>
</body>
</html>
