<!-- 2)insert a new element at a specific index in an array 
Input: [1, 2, 3], Insert: 4, Index: 1
Output: [1, 4, 2, 3]-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.Insert Element At Index</title>
</head>
<body>
    <h1>2.Insert Element At Index</h1>
    <script>
        function insertElement(){
        let numbers = [1,2,3];
        numbers.splice(1,0,4);
        console.log(numbers);
        }
        insertElement();
    </script>
</body>
</html>
