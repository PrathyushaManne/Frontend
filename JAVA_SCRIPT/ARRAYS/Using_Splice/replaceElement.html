<!-- 3) replace an element in an array at a given index 
Input: [1, 2, 3], Replace: 4, Index: 1
Output: [1, 4, 3]-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.Replace Element</title>
</head>
<body>
    <h1>3.Replace Element</h1>
    <script>
        function replaceElement(){
        let numbers = [1,2,3];
        numbers.splice(1,1,4);
        console.log(numbers);
        }
        replaceElement();
    </script>
</body>
</html>
